version: '3.8'

services:
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api01
      - api02
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: '100MB'

  api01:
    build: .
    environment:
      - SERVER_PORT=8080
      - DB_HOST=db
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '200MB'

  api02:
    build: .
    environment:
      - SERVER_PORT=8080
      - DB_HOST=db
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '200MB'

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=rinha
      - POSTGRES_USER=rinha
      - POSTGRES_DB=rinha
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: '300MB'
